name: Android Debug APK Build

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK (:android:assembleDebug)
        run: gradle android:assembleDebug

      - name: Upload AethelgardSurvival Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AethelgardSurvival-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            android/build/outputs/apk/debug/android-debug.apk
